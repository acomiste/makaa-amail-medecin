name: Recherche emails médecins

on:
  # Lancement manuel depuis l'onglet "Actions" de GitHub
  workflow_dispatch:
  # Décommentez pour un lancement automatique programmé (ex: tous les jours à 6h UTC)
  # schedule:
  #   - cron: '0 6 * * *'

jobs:
  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # à ajuster selon le nombre de médecins restants

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # CORRECTION 1 : Passage à la version v2 stable pour supporter Selenium 4
      - name: Installer Google Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      # CORRECTION 2 : Ajout explicite de la bibliothèque nécessaire au script
      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests

      # CORRECTION 3 : Forçage de l'environnement Python non-bufferisé global
      - name: Lancer le script (mode headless)
        run: python script_recherche_medecins.py
        env:
          RUN_HEADLESS: "true"
          PYTHONUNBUFFERED: "1"  # Force l'affichage du texte sur GitHub à la milliseconde près

      - name: Sauvegarder les fichiers CSV en résultat (artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-medecins
          path: |
            medecins.csv
            resultats_medecins.csv
          retention-days: 30
